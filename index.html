<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عالم الغربية المفتوح | Gharbia Open World</title>
<meta name="description" content="لعبة عالم مفتوح في محافظة الغربية — العب من المتصفح أو ثبّتها كتطبيق.">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0e14;color:#efe6d2;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 50% -10%,rgba(31,122,114,.55),transparent 60%),radial-gradient(600px 400px at 50% 110%,rgba(242,182,50,.18),transparent 60%),#0b0e14}
main{width:min(380px,100%);text-align:center}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
h1{margin:16px 0 4px;font-size:34px;background:linear-gradient(180deg,#ffe3a1,#f2b632 55%,#d98a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 22px;opacity:.75;font-size:14px;letter-spacing:.5px}
a.play{display:block;padding:15px;border-radius:16px;background:linear-gradient(180deg,#ffd36b,#f2b632 60%,#e39a1c);color:#2a1b00;font-weight:800;font-size:18px;text-decoration:none;box-shadow:0 10px 26px rgba(242,182,50,.3)}
small{display:block;margin-top:14px;opacity:.6;line-height:1.7}
</style>
</head>
<body>
<main>
<img src="icon-192.png" alt="عالم الغربية" width="96" height="96">
<h1>عالم الغربية</h1>
<p>GHARBIA OPEN WORLD</p>
<a class="play" href="game.html">▶ العب الآن</a>
<small>أول مرة بتحمّل حوالي 20 ميجا، وبعدها بتشتغل أسرع وأوفلاين.<br>تقدر تثبّتها كتطبيق من قائمة المتصفح.</small>
</main>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
